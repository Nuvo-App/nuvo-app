name: CI

on:
  push:
    branches: ['redesign/**', 'motion-ota-tuning', 'main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
      # Until stage S9 deletes the pre-v13 shell, the existing suite guards the
      # old app (NUVO_V13=false must stay byte-for-byte unchanged) and test/v13
      # covers the new shell with the flag at its default (on).
      - name: flutter test (pre-v13 suite, NUVO_V13=false)
        run: |
          set +e
          flutter test --dart-define=NUVO_V13=false $(ls -d test/* | grep -v '^test/v13$') --reporter json > test-results.json
          set -e
          node tool/ci/check_test_failures.mjs test-results.json tool/ci/known_failing_tests.txt
      - name: flutter test (v13, default flag)
        run: flutter test test/v13
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results
          path: test-results.json
          retention-days: 7

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
