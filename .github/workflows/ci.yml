name: CI

on:
  push:
    branches: ['redesign/**', 'motion-ota-tuning', 'main']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: |
          set +e
          flutter test --reporter json > test-results.json
          set -e
          node tool/ci/check_test_failures.mjs test-results.json tool/ci/known_failing_tests.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-results
          path: test-results.json
          retention-days: 7

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
