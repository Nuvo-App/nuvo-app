name: nuvo
description: "Nuvo - social competition for racing on goals with your crew."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # UI / typography / motion
  google_fonts: ^6.2.1
  animations: ^2.0.11
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0

  # Sharing & links
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  app_links: ^6.3.2

  # Push (phase F). Dormant until GoogleService-Info.plist / google-services.json
  # + the APNs key are added — PushService guards Firebase.initializeApp() and
  # no-ops if it throws. See docs/agents/19 §10.
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  image_cropper: ^12.0.0

  # Auth / networking
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^5.0.0
  web: ^1.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.6
  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.14.1
  # QR / invite-link scanning. Same GoogleMLKit 9.x umbrella as pose_detection
  # (mobile_scanner pins an incompatible MLKit 7.x) — reuses the existing
  # camera pipeline + camera_image_converter.
  google_mlkit_barcode_scanning: ^0.14.1

  # Motion Engine V2 — on-device MotionBERT inference (docs/agents/13)
  onnxruntime: ^1.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # Source of truth: the Icon Composer project
  # "Scam Call v3/nuvo/App icons/working v2/Untitled.icon" (blue automatic
  # gradient + the light "M" mark layer). Xcode's actool does not compile a
  # bare .icon stack in the Flutter build, so the three appearances are
  # rendered from that source (tools/render_app_icon.py) into
  # assets/branding/nuvo_app_icon*.png and expanded to AppIcon.appiconset here.
  android: true
  ios: true
  image_path: "assets/branding/nuvo_app_icon.png"
  image_path_ios_dark_transparent: "assets/branding/nuvo_app_icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/branding/nuvo_app_icon_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true
  web:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/
    - assets/animations/splash/
    - assets/models/
