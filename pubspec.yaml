name: nuvo
description: "Nuvo - social competition for racing on goals with your crew."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # UI / typography / motion
  google_fonts: ^6.2.1
  animations: ^2.0.11
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0

  # Sharing & links
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  app_links: ^6.3.2

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  image_cropper: ^12.0.0

  # Auth / networking
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^5.0.0
  web: ^1.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.6
  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.14.1

  # Motion Engine V2 — on-device MotionBERT inference (docs/agents/13)
  onnxruntime: ^1.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/nuvo_app_icon.png"
  # iOS 18 appearance variants (from Icon Composer "export all").
  image_path_ios_dark_transparent: "assets/branding/nuvo_app_icon_dark.png"
  image_path_ios_tinted_grayscale: "assets/branding/nuvo_app_icon_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true
  web:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/branding/
    - assets/animations/splash/
    - assets/models/
